services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: idem
      POSTGRES_PASSWORD: idem
      POSTGRES_DB: idem
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idem -d idem"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    build: .
    command: ["migrate"]
    environment:
      IDEM_DATABASE_URL: postgres://idem:idem@postgres:5432/idem?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["api"]
    environment:
      IDEM_DATABASE_URL: postgres://idem:idem@postgres:5432/idem?sslmode=disable
      IDEM_API_TOKENS: demo=demo-token-0123456789
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  fakeprovider:
    build: .
    entrypoint: ["/fakeprovider"]
    ports:
      - "9090:9090"

  worker:
    build: .
    command: ["worker"]
    environment: &worker-env
      IDEM_DATABASE_URL: postgres://idem:idem@postgres:5432/idem?sslmode=disable
      IDEM_PROVIDER_URL: http://fakeprovider:9090
    depends_on: &worker-deps
      migrate:
        condition: service_completed_successfully
      fakeprovider:
        condition: service_started

  sweeper:
    build: .
    command: ["sweeper"]
    environment: *worker-env
    depends_on: *worker-deps

volumes:
  pgdata:
