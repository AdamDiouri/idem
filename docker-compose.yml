# Secrets and local settings come from .env (copy .env.example; `make up` does
# it for you). Secrets use ${VAR:?…}, so compose refuses to start without them.
# Migrations run as the owner (idem); everything else logs in as the restricted
# application user idem_app_user (a member of role idem_app, which cannot
# UPDATE, DELETE or TRUNCATE the ledger). Postgres creates that login from
# deploy/postgres/initdb when it first creates its volume; `make app-user`
# creates or updates it on an existing one.
x-owner-database-url: &owner-database-url postgres://idem:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/idem?sslmode=disable
x-database-url: &database-url postgres://idem_app_user:${IDEM_APP_DB_PASSWORD:?set IDEM_APP_DB_PASSWORD in .env (see .env.example)}@postgres:5432/idem?sslmode=disable

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: idem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: idem
      IDEM_APP_DB_PASSWORD: ${IDEM_APP_DB_PASSWORD:?set IDEM_APP_DB_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idem -d idem"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    build: .
    command: ["migrate"]
    environment:
      IDEM_DATABASE_URL: *owner-database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["api"]
    stop_grace_period: 25s # > IDEM_SHUTDOWN_GRACE (20s) so in-flight requests drain
    environment:
      IDEM_DATABASE_URL: *database-url
      IDEM_API_TOKENS: demo=${IDEM_DEMO_TOKEN:?set IDEM_DEMO_TOKEN in .env (see .env.example)}
      IDEM_PROVIDER_WEBHOOK_SECRETS: ${IDEM_WEBHOOK_SECRET:?set IDEM_WEBHOOK_SECRET in .env (see .env.example)}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  fakeprovider:
    build: .
    entrypoint: ["/fakeprovider"]
    environment:
      FAKEPROVIDER_PAYOUT_SETTLE: ${FAKEPROVIDER_PAYOUT_SETTLE:-2s} # accepted payouts settle 2s later
      # ...and are announced by signed webhook (slice 2.2); polling stays the net
      FAKEPROVIDER_WEBHOOK_URL: http://api:8080/webhooks/provider
      FAKEPROVIDER_WEBHOOK_SECRET: ${IDEM_WEBHOOK_SECRET:?set IDEM_WEBHOOK_SECRET in .env (see .env.example)}
    ports:
      - "9090:9090"

  worker:
    build: .
    command: ["worker"]
    stop_grace_period: 20s # > IDEM_SHUTDOWN_GRACE so in-flight steps finish
    ports:
      - "127.0.0.1:8090:8090" # internal: /metrics and /debug/pprof (localhost only)
    environment: &worker-env
      IDEM_DATABASE_URL: *database-url
      IDEM_PROVIDER_URL: http://fakeprovider:9090
      IDEM_CALLBACK_DEADLINE: ${IDEM_CALLBACK_DEADLINE:-5s} # demo: poll a waiting payout after 5s (default 10m)
    depends_on: &worker-deps
      migrate:
        condition: service_completed_successfully
      fakeprovider:
        condition: service_started

  sweeper:
    build: .
    command: ["sweeper"]
    environment: *worker-env
    ports:
      - "127.0.0.1:8091:8090" # internal: /metrics and /debug/pprof (localhost only)
    depends_on: *worker-deps

  # Slice 2.5: delivers workflow outcomes from the outbox to each shop's
  # webhook URL, signed with that shop's secret. Any number may run.
  relay:
    build: .
    command: ["relay"]
    stop_grace_period: 20s # > IDEM_SHUTDOWN_GRACE so an in-flight delivery finishes
    ports:
      - "127.0.0.1:8092:8090" # internal: /metrics and /debug/pprof (localhost only)
    environment:
      IDEM_DATABASE_URL: *database-url
      IDEM_CLIENT_WEBHOOKS: demo=http://fakeshop:8000/hooks
      IDEM_CLIENT_WEBHOOK_SECRETS: demo=${IDEM_DEMO_WEBHOOK_SECRET:?set IDEM_DEMO_WEBHOOK_SECRET in .env (see .env.example)}
    depends_on:
      migrate:
        condition: service_completed_successfully
      fakeshop:
        condition: service_started

  # A shop receiving the demo client's webhooks: verifies, deduplicates, and
  # shows what it learned at http://localhost:8000/_seen.
  fakeshop:
    build: .
    entrypoint: ["/fakeshop"]
    environment:
      FAKESHOP_SECRET: ${IDEM_DEMO_WEBHOOK_SECRET:?set IDEM_DEMO_WEBHOOK_SECRET in .env (see .env.example)}
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "9091:9090" # 9090 is the fake provider
    depends_on:
      - api
      - worker
      - sweeper
      - relay

volumes:
  pgdata:
