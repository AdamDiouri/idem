# idem alert rules. Every alert links to the runbook section that says what it
# means and what to do. State gauges are read from sweepers only (job
# "idem-sweeper"; other processes export them at 0) and aggregated with max(),
# never sum(), since several sweepers export the same values. Because every
# state alert depends on a live sweeper, two alerts watch the sweeper itself.
groups:
  - name: idem
    rules:
      - alert: IdemWorkflowsNeedAttention
        expr: sum(max by (reason) (idem_parked_workflows{job="idem-sweeper"})) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} workflows are parked and need a human"
          runbook: docs/runbooks/needs-attention.md#idemworkflowsneedattention

      - alert: IdemMoneyMayHaveMoved
        expr: sum(max by (reason) (idem_parked_workflows{job="idem-sweeper", reason!~"attempts_exhausted_no_effect|hook_failed_no_effect"})) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} parked workflows may have moved money without a ledger record"
          runbook: docs/runbooks/needs-attention.md#idemmoneymayhavemoved

      - alert: IdemWorkflowsStuck
        expr: max(idem_unsettled_workflow_max_idle_seconds{job="idem-sweeper"}) > 900
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "An unsettled workflow has made no progress for {{ $value | humanizeDuration }}"
          runbook: docs/runbooks/needs-attention.md#idemworkflowsstuck

      - alert: IdemStepsOverAttemptLimit
        expr: max(idem_steps_over_attempt_limit{job="idem-sweeper"}) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} unfinished steps were claimed more than once past their attempt limit"
          runbook: docs/runbooks/needs-attention.md#idemstepsoverattemptlimit

      - alert: IdemFencedCommitsSpike
        expr: sum(rate(idem_step_attempts_total{outcome="fenced"}[5m])) > 0.1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Workers keep losing leases mid-step ({{ $value | humanize }}/s)"
          runbook: docs/runbooks/needs-attention.md#idemfencedcommitsspike

      - alert: IdemProviderSlow
        expr: histogram_quantile(0.99, sum by (le) (rate(idem_provider_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Provider p99 latency is {{ $value | humanizeDuration }}"
          runbook: docs/runbooks/needs-attention.md#idemproviderslow

      - alert: IdemSweeperDown
        expr: absent(up{job="idem-sweeper"} == 1)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "No sweeper is up: leases are not reclaimed and every state alert is blind"
          runbook: docs/runbooks/needs-attention.md#idemsweeperdown

      - alert: IdemSweeperSnapshotStale
        expr: time() - max(idem_sweeper_last_snapshot_timestamp_seconds{job="idem-sweeper"}) > 120
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Sweeper state gauges are {{ $value | humanizeDuration }} old: state alerts may be wrong"
          runbook: docs/runbooks/needs-attention.md#idemsweepersnapshotstale

      # Slice 2.2: provider webhooks.
      - alert: IdemWebhookConflict
        expr: max(idem_webhook_conflicts_open{job="idem-sweeper"}) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} provider events contradict idem: money may have moved both ways"
          runbook: docs/runbooks/needs-attention.md#idemwebhookconflict

      - alert: IdemInboxBacklog
        expr: max(idem_inbox_oldest_pending_age_seconds{job="idem-sweeper"}) > 600
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "The oldest unprocessed provider webhook is {{ $value | humanizeDuration }} old"
          runbook: docs/runbooks/needs-attention.md#ideminboxbacklog

      - alert: IdemCallbacksOverdue
        expr: max(idem_callbacks_overdue{job="idem-sweeper"}) > 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} waiting payouts are overdue for a poll: polling is not keeping up"
          runbook: docs/runbooks/needs-attention.md#idemcallbacksoverdue

      - alert: IdemWebhookSignatureFailures
        expr: sum(rate(idem_webhooks_received_total{result=~"bad_signature|stale"}[5m])) > 0.1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Provider webhooks keep failing verification: a wrong secret, a clock problem, or forged requests"
          runbook: docs/runbooks/needs-attention.md#idemwebhooksignaturefailures

      - alert: IdemWebhookOrphans
        expr: sum(increase(idem_webhooks_applied_total{outcome="orphaned"}[1h])) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} provider webhooks in the last hour matched no payout idem knows"
          runbook: docs/runbooks/needs-attention.md#idemwebhookorphans

      # Slice 2.3: is the database connection pool a bottleneck?
      - alert: IdemDBPoolSaturated
        expr: max by (job) (rate(idem_db_pool_acquire_wait_seconds_total[5m])) > 0.1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.job }} processes spend {{ $value | humanize }}s per second waiting for a database connection"
          runbook: docs/runbooks/needs-attention.md#idemdbpoolsaturated

      # Slice 2.5: workflow outcomes waiting to reach their shop.
      - alert: IdemOutboxBacklog
        expr: max(idem_outbox_oldest_pending_age_seconds{job="idem-sweeper"}) > 900
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "A workflow outcome has waited {{ $value | humanizeDuration }} to reach its shop: a shop is down or slow, or no relay runs"
          runbook: docs/runbooks/needs-attention.md#idemoutboxbacklog

      - alert: IdemOutboxDead
        expr: max(idem_outbox_dead{job="idem-sweeper"}) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} workflow outcomes were never delivered to their shop; redeliver them once it is back"
          runbook: docs/runbooks/needs-attention.md#idemoutboxdead

      # Slice 2.6: the ledger and the provider disagree (outside parked
      # workflows, whose differences are evidence for the parked alert).
      - alert: IdemReconciliationDrift
        expr: sum(max by (kind) (idem_reconciliation_discrepancies{job="idem-sweeper", parked="false"})) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "The latest reconciliation found {{ $value }} differences between the provider's records and the ledger"
          runbook: docs/runbooks/needs-attention.md#idemreconciliationdrift

      - alert: IdemReconciliationStale
        expr: time() - max(idem_reconciliation_last_success_timestamp_seconds{job="idem-sweeper"}) > 10800
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "No reconciliation has succeeded for over 3 hours: drift would go unnoticed"
          runbook: docs/runbooks/needs-attention.md#idemreconciliationstale
