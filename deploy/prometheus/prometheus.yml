# Prometheus for the local compose stack: scrapes every idem process.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: idem-api
    static_configs:
      - targets: ["api:8080"]
  - job_name: idem-worker
    static_configs:
      - targets: ["worker:8090"]
  - job_name: idem-sweeper
    static_configs:
      - targets: ["sweeper:8090"]
